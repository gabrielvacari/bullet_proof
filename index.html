<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bullet Proof</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #12141a;
        color: #e6e8ee;
        font:
          15px/1.5 system-ui,
          -apple-system,
          sans-serif;
      }
      #scene {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* FR-GP-021: shown whenever pointer lock is not held. */
      #resume {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.5rem;
        text-align: center;
        background: rgb(18 20 26 / 72%);
        cursor: pointer;
        user-select: none;
      }
      #resume[hidden] {
        display: none;
      }
      #resume strong {
        font-size: 1.25rem;
        font-weight: 600;
      }
      #resume span {
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="resume">
      <strong>Click to play</strong>
      <span
        >WASD move &middot; Shift sprint &middot; Ctrl crouch &middot; Space jump &middot;
        Esc release</span
      >
    </div>
    <script type="module" src="/client/boot/main.ts"></script>
  </body>
</html>
